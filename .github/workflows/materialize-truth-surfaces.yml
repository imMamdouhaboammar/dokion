name: Materialize Truth Surfaces

on:
  push:
    branches: [fix/adoption-truth-recovery-main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/adoption-truth-recovery-main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Remove planned commands from static surfaces
        shell: python
        run: |
          import json
          from pathlib import Path

          planned = {
              "dokion hub",
              "dokion try",
              "dokion accept",
              "dokion trace",
          }

          manifest_path = Path("dokion.json")
          manifest = json.loads(manifest_path.read_text())
          commands = manifest["dokion_cli"]["commands"]
          present = {entry["command"] for entry in commands if entry["command"] in planned}
          if present != planned:
              raise SystemExit(f"Expected all planned commands in source manifest before removal, found: {sorted(present)}")
          manifest["dokion_cli"]["commands"] = [
              entry for entry in commands if entry["command"] not in planned
          ]
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n")

          spec_path = Path("SPEC.md")
          spec_lines = spec_path.read_text().splitlines()
          markers = tuple(f"`{command}`" for command in sorted(planned))
          found = {marker: False for marker in markers}
          kept = []
          for line in spec_lines:
              matched = False
              for marker in markers:
                  if marker in line:
                      found[marker] = True
                      matched = True
              if not matched:
                  kept.append(line)
          missing = [marker for marker, seen in found.items() if not seen]
          if missing:
              raise SystemExit(f"Planned command markers missing from SPEC.md: {missing}")
          spec_path.write_text("\n".join(kept) + "\n")

      - name: Regenerate product surface
        run: bun run generate:product-surface

      - name: Commit materialized surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dokion.json SPEC.md generated/product-surface.json
          if git diff --cached --quiet; then
            echo "No materialization changes were required"
            exit 0
          fi
          git commit -m "chore: materialize truthful command surfaces"
          git push origin HEAD:fix/adoption-truth-recovery-main
