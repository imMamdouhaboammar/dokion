name: Materialize Autoresearch Quarantine

on:
  push:
    branches: [fix/adoption-truth-recovery-main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/adoption-truth-recovery-main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Remove incomplete autoresearch surfaces
        shell: python
        run: |
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              target.write_text(source.replace(old, new, 1))

          replace_once(
              "src/cli.ts",
              'import { handleAutoresearchCommand } from "./cli/handlers/autoresearch.ts";\n',
              "",
          )
          replace_once(
              "src/cli.ts",
              '''    case "autoresearch": {\n      if (invocation.command === "autoresearch") {\n        await handleAutoresearchCommand(root, invocation);\n      }\n      return;\n    }\n''',
              "",
          )
          replace_once(
              "src/cli/parser.ts",
              '''  if (rawCommand === "autoresearch") {\n    const parsed = parseTokens(rawCommand, tokens, {\n      "--auto": { kind: "boolean" },\n      "--classic": { kind: "boolean" },\n      "--dry-run": { kind: "boolean" },\n      "--max-cycles": { kind: "value" },\n      "--evals": { kind: "boolean" }\n    });\n    const flags = new Set<string>();\n    if (parsed.options.get("--auto") === true) flags.add("auto");\n    if (parsed.options.get("--classic") === true) flags.add("classic");\n    if (parsed.options.get("--dry-run") === true) flags.add("dry-run");\n    if (parsed.options.get("--evals") === true) flags.add("evals");\n\n    return {\n      command: "autoresearch",\n      positionals: parsed.positionals,\n      options: parsed.options,\n      flags,\n      dryRun: parsed.options.get("--dry-run") === true,\n      format: outputFormat(rawCommand, parsed.options)\n    };\n  }\n\n''',
              "",
          )
          replace_once(
              "src/cli/types.ts",
              '''  | ({\n      command: "autoresearch";\n      positionals: string[];\n      options: Map<string, true | string>;\n      flags: Set<string>;\n      dryRun: boolean;\n    } & CliFormatted)\n''',
              "",
          )

          manifest_path = Path("dokion.json")
          manifest = json.loads(manifest_path.read_text())
          commands = manifest["dokion_cli"]["commands"]
          matches = [entry for entry in commands if entry["command"] == "dokion autoresearch"]
          if len(matches) != 1:
              raise SystemExit(f"Expected one autoresearch manifest entry, found {len(matches)}")
          manifest["dokion_cli"]["commands"] = [
              entry for entry in commands if entry["command"] != "dokion autoresearch"
          ]
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n")

          spec_path = Path("SPEC.md")
          lines = spec_path.read_text().splitlines()
          removed = [line for line in lines if "`dokion autoresearch`" in line]
          if not removed:
              raise SystemExit("Expected at least one autoresearch marker in SPEC.md")
          spec_path.write_text("\n".join(line for line in lines if "`dokion autoresearch`" not in line) + "\n")

          Path(".github/workflows/materialize-autoresearch-quarantine.yml").unlink()

      - name: Regenerate product surface
        run: bun run generate:product-surface

      - name: Commit quarantine materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli.ts src/cli/parser.ts src/cli/types.ts dokion.json SPEC.md generated/product-surface.json .github/workflows/materialize-autoresearch-quarantine.yml
          git commit -m "fix: remove incomplete autoresearch execution surface"
          git push origin HEAD:fix/adoption-truth-recovery-main
