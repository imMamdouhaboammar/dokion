name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python contract dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Schema conformance
        run: python3 schemas/conformance_test.py

      - name: Runtime contract validation
        run: bun run validate:contracts

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          bun test 2>&1 | tee test.log

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck.log

      - name: Build
        run: bun run build

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokion-ci-diagnostics
          path: |
            test.log
            typecheck.log
            bun.lock
          if-no-files-found: ignore
