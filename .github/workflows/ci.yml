name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python contract dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Schema conformance
        run: python3 schemas/conformance_test.py

      - name: Runtime contract validation
        run: bun run validate:contracts

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          bun test 2>&1 | tee test.log

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck.log

      - name: Build
        run: bun run build

      - name: Build cross-platform release binaries
        shell: bash
        run: |
          bun run scripts/build-release.ts
          test "$(find release -maxdepth 1 -type f -name 'dokion-*' | wc -l)" -eq 5
          rm -rf release

      - name: Validate packed distribution
        shell: bash
        run: |
          set -o pipefail
          bun run validate:distribution 2>&1 | tee distribution.log

      - name: Smoke-test clean Bun installation
        shell: bash
        run: |
          set -o pipefail
          bun run smoke:package 2>&1 | tee package-smoke.log

      - name: Validate Gemini CLI extension
        shell: bash
        run: |
          set -o pipefail
          bunx @google/gemini-cli@0.51.0 extensions validate . 2>&1 | tee gemini-extension.log

      - name: Verify no tracked mutation or credential residue
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test ! -e .npmrc
          test ! -e bunfig.toml
          test ! -e .env
          test ! -e .dokion
          test ! -e HARDENING.md
          test -z "$(find . -maxdepth 1 -type f -name '*.tgz' -print -quit)"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokion-ci-diagnostics
          path: |
            test.log
            typecheck.log
            distribution.log
            package-smoke.log
            gemini-extension.log
            bun.lock
            schemas/dokion-playbook.schema.json
            schemas/dokion-state.schema.json
          if-no-files-found: ignore
