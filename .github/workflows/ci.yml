name: PR 50 manifest repair

on:
  push:
    branches:
      - feat/registry-protocol-schemas
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/registry-protocol-schemas
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          bun install --frozen-lockfile

      - name: Patch exact stale manifest entry and restore CI
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("dokion.json")
          text = path.read_text()
          old = '''"usage": "dokion hub <search|pull|fork|leaderboard> [<package-id>]",\n        "purpose": "Interact with GitHub Native Decentralized Community Playbook Hub, Registry, and Leaderboard."'''
          new = '''"usage": "dokion hub",\n        "purpose": "Federated Playbook Registry is unavailable while the replacement protocol is implemented under #47."'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one stale Hub manifest entry, found {text.count(old)}")
          path.write_text(text.replace(old, new))

          original_ci = subprocess.check_output(
              ["git", "show", "origin/main:.github/workflows/ci.yml"],
              text=True
          )
          Path(".github/workflows/ci.yml").write_text(original_ci)

      - name: Verify focused contracts
        run: >-
          bun test
          tests/cli/command-registry-runtime.test.ts
          tests/contracts/registry-surface-quarantine.test.ts
          tests/contracts/cli-parity.test.ts
          tests/registry/protocol-schemas.test.ts
          tests/registry/python-conformance.test.ts

      - name: Verify repository
        run: |
          python3 schemas/conformance_test.py
          python3 schemas/registry/conformance_test.py
          bun test
          bun run typecheck
          bun run build

      - name: Commit verified repair
        run: |
          git config user.name "dokion-ci"
          git config user.email "actions@users.noreply.github.com"
          git add dokion.json .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "fix(registry): correct planned Hub manifest metadata"
          git push origin HEAD:feat/registry-protocol-schemas
