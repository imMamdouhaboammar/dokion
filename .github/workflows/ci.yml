name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python contract dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Schema conformance
        run: |
          python3 schemas/conformance_test.py
          bun run validate:registry-protocol

      - name: Runtime contract validation
        run: bun run validate:contracts

      - name: Runtime tests
        shell: bash
        run: |
          set -o pipefail
          bun run test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend tests
        working-directory: frontend
        run: bun run test

      - name: Frontend typecheck
        working-directory: frontend
        run: bun run lint

      - name: Frontend build
        working-directory: frontend
        run: bun run build

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Build
        run: bun run build

      - name: Validate release truth
        run: bun run validate:release-truth --output release-truth-report.json

      - name: Build and smoke-test release binaries
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/build-release.ts
          test "$(find release -maxdepth 1 -type f -name 'dokion-*' | wc -l)" -eq 5
          ./release/dokion-linux-x64 --help | grep -F "Dokion 0.3.0"
          CLEAN_ROOT="$(mktemp -d)"
          trap 'rm -rf "$CLEAN_ROOT" release' EXIT
          (
            cd "$CLEAN_ROOT"
            "$GITHUB_WORKSPACE/release/dokion-linux-x64" validate --catalog-only | grep -F 'builtin:dokion.json'
          )

      - name: Validate packed distribution
        shell: bash
        run: |
          set -o pipefail
          bun run validate:distribution 2>&1 | tee "$RUNNER_TEMP/distribution.log"

      - name: Smoke-test clean Bun installation
        shell: bash
        run: |
          set -o pipefail
          bun run smoke:package 2>&1 | tee "$RUNNER_TEMP/package-smoke.log"

      - name: Validate Gemini CLI extension
        shell: bash
        run: |
          set -euo pipefail
          VALIDATOR_ROOT="$(mktemp -d)"
          EXTENSION_ROOT="$VALIDATOR_ROOT/extension"
          mkdir -p "$EXTENSION_ROOT"
          trap 'rm -rf "$VALIDATOR_ROOT"' EXIT
          git archive HEAD | tar -x -C "$EXTENSION_ROOT"
          (
            cd "$VALIDATOR_ROOT"
            bunx @google/gemini-cli@0.51.0 extensions validate "$EXTENSION_ROOT"
          ) 2>&1 | tee "$RUNNER_TEMP/gemini-extension.log"

      - name: Verify no tracked mutation or credential residue
        shell: bash
        run: |
          set -uo pipefail
          status=0
          git diff --exit-code || status=1
          git diff --cached --exit-code || status=1
          for path in .npmrc bunfig.toml .env .dokion HARDENING.md; do
            if [[ -e "$path" ]]; then
              echo "::error::Unexpected repository artifact remains after verification: $path"
              if [[ -d "$path" ]]; then
                find "$path" -maxdepth 3 -print
              else
                ls -la "$path"
              fi
              status=1
            fi
          done
          mapfile -t archives < <(find . -maxdepth 1 -type f -name '*.tgz' -print)
          if (( ${#archives[@]} > 0 )); then
            echo "::error::Unexpected package archives remain after verification"
            printf '%s\n' "${archives[@]}"
            status=1
          fi
          exit "$status"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokion-ci-diagnostics
          path: |
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/typecheck.log
            ${{ runner.temp }}/distribution.log
            ${{ runner.temp }}/package-smoke.log
            release-truth-report.json
            ${{ runner.temp }}/gemini-extension.log
            bun.lock
            schemas/dokion-playbook.schema.json
            schemas/dokion-state.schema.json
            schemas/registry/*.schema.json
          if-no-files-found: ignore
