name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded Registry path hardening
        if: github.ref == 'refs/heads/feat/registry-pull-immutable-cache' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/registry/artifact-fetcher.ts",
              'import { DokionError, type DokionErrorCode } from "../core/errors.ts";\nimport {',
              'import { DokionError, type DokionErrorCode } from "../core/errors.ts";\nimport { assertSafeRegularFilePath } from "./filesystem-safety.ts";\nimport {'
          )
          replace_once(
              "src/registry/artifact-fetcher.ts",
              '  const expectedSize = positiveExpectedSize(options.expectedSize);\n  let handle;',
              '  const expectedSize = positiveExpectedSize(options.expectedSize);\n  await assertSafeRegularFilePath(options.path);\n  let handle;'
          )

          replace_once(
              "src/registry/artifact-cache.ts",
              'import { chmod, link, lstat, mkdir, open, unlink } from "node:fs/promises";',
              'import { chmod, link, lstat, open, unlink } from "node:fs/promises";'
          )
          replace_once(
              "src/registry/artifact-cache.ts",
              'import { readVerifiedLocalBytes } from "./artifact-fetcher.ts";\nimport { REGISTRY_PACKAGE_LIMITS }',
              'import { readVerifiedLocalBytes } from "./artifact-fetcher.ts";\nimport { ensureSafeDirectoryPath } from "./filesystem-safety.ts";\nimport { REGISTRY_PACKAGE_LIMITS }'
          )
          replace_once(
              "src/registry/artifact-cache.ts",
              '    await cleanupStaleRegistryArtifactTemps(options.cacheRoot);\n    await mkdir(temporaryDirectory, { recursive: true });\n    await mkdir(directory, { recursive: true });',
              '    await cleanupStaleRegistryArtifactTemps(options.cacheRoot);\n    await ensureSafeDirectoryPath(temporaryDirectory);\n    await ensureSafeDirectoryPath(directory);'
          )
          replace_once(
              "src/registry/artifact-cache.ts",
              '''        if ((error as NodeJS.ErrnoException).code === "EEXIST") {
          await unlinkIfPresent(evidencePath);
          evidencePublished = false;
          await unlinkIfPresent(temporaryArtifactPath);
          return verifyExisting(options, artifactPath, evidencePath);
        }''',
              '''        if ((error as NodeJS.ErrnoException).code === "EEXIST") {
          await unlinkIfPresent(temporaryArtifactPath);
          return verifyExisting(options, artifactPath, evidencePath);
        }'''
          )

          replace_once(
              "src/registry/source-client.ts",
              '["-c", "credential.helper=", "fetch", "--quiet", "--depth=1", "--filter=blob:none", source.url, source.immutable_revision],',
              '''[
          "-c", "credential.helper=",
          "-c", "http.followRedirects=false",
          "-c", "protocol.allow=never",
          "-c", "protocol.https.allow=always",
          "-c", "protocol.file.allow=never",
          "fetch", "--quiet", "--depth=1", "--filter=blob:none", source.url, source.immutable_revision
        ],'''
          )

          test = Path("tests/registry/filesystem-safety.test.ts")
          text = test.read_text()
          text = text.replace(
              'import { DokionError } from "../../src/core/errors.ts";',
              'import { DokionError, type DokionErrorCode } from "../../src/core/errors.ts";'
          )
          text = text.replace('code: string', 'code: DokionErrorCode')
          test.write_text(text)
          PY
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/registry/artifact-fetcher.ts src/registry/artifact-cache.ts src/registry/source-client.ts tests/registry/filesystem-safety.test.ts .github/workflows/ci.yml
          git commit -m "fix(registry): harden source and cache path boundaries"
          git push origin HEAD:feat/registry-pull-immutable-cache

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python contract dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Schema conformance
        run: |
          python3 schemas/conformance_test.py
          bun run validate:registry-protocol

      - name: Runtime contract validation
        run: bun run validate:contracts

      - name: Runtime tests
        shell: bash
        run: |
          set -o pipefail
          bun run test 2>&1 | tee test.log

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend tests
        working-directory: frontend
        run: bun run test

      - name: Frontend typecheck
        working-directory: frontend
        run: bun run lint

      - name: Frontend build
        working-directory: frontend
        run: bun run build

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck.log

      - name: Build
        run: bun run build

      - name: Build and smoke-test release binaries
        shell: bash
        run: |
          set -euo pipefail
          bun run scripts/build-release.ts
          test "$(find release -maxdepth 1 -type f -name 'dokion-*' | wc -l)" -eq 5
          ./release/dokion-linux-x64 --help | grep -F "Dokion 0.3.0"
          CLEAN_ROOT="$(mktemp -d)"
          trap 'rm -rf "$CLEAN_ROOT" release' EXIT
          (
            cd "$CLEAN_ROOT"
            "$GITHUB_WORKSPACE/release/dokion-linux-x64" validate --catalog-only | grep -F 'builtin:dokion.json'
          )

      - name: Validate packed distribution
        shell: bash
        run: |
          set -o pipefail
          bun run validate:distribution 2>&1 | tee distribution.log

      - name: Smoke-test clean Bun installation
        shell: bash
        run: |
          set -o pipefail
          bun run smoke:package 2>&1 | tee package-smoke.log

      - name: Validate Gemini CLI extension
        shell: bash
        run: |
          set -euo pipefail
          VALIDATOR_ROOT="$(mktemp -d)"
          EXTENSION_ROOT="$VALIDATOR_ROOT/extension"
          mkdir -p "$EXTENSION_ROOT"
          trap 'rm -rf "$VALIDATOR_ROOT"' EXIT
          git archive HEAD | tar -x -C "$EXTENSION_ROOT"
          (
            cd "$VALIDATOR_ROOT"
            bunx @google/gemini-cli@0.51.0 extensions validate "$EXTENSION_ROOT"
          ) 2>&1 | tee "$GITHUB_WORKSPACE/gemini-extension.log"

      - name: Verify no tracked mutation or credential residue
        shell: bash
        run: |
          set -uo pipefail
          status=0
          git diff --exit-code || status=1
          git diff --cached --exit-code || status=1
          for path in .npmrc bunfig.toml .env .dokion HARDENING.md; do
            if [[ -e "$path" ]]; then
              echo "::error::Unexpected repository artifact remains after verification: $path"
              if [[ -d "$path" ]]; then
                find "$path" -maxdepth 3 -print
              else
                ls -la "$path"
              fi
              status=1
            fi
          done
          mapfile -t archives < <(find . -maxdepth 1 -type f -name '*.tgz' -print)
          if (( ${#archives[@]} > 0 )); then
            echo "::error::Unexpected package archives remain after verification"
            printf '%s\n' "${archives[@]}"
            status=1
          fi
          exit "$status"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dokion-ci-diagnostics
          path: |
            test.log
            typecheck.log
            distribution.log
            package-smoke.log
            gemini-extension.log
            bun.lock
            schemas/dokion-playbook.schema.json
            schemas/dokion-state.schema.json
            schemas/registry/*.schema.json
          if-no-files-found: ignore
