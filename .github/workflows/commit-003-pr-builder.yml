name: Prepare Commit 003

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'feat/003-bounded-autopilot-semantics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/003-bounded-autopilot-semantics
          fetch-depth: 0

      - name: Link bounded autopilot contract from the specification
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("SPEC.md")
          specification = path.read_text()
          anchor = """The classes of content that are always untrusted: SKILL.md bodies and plugin documentation,
          scanner and linter output, CVE and advisory text, dependency metadata, commit messages,
          issue and pull request bodies, and any file content read from the repository under audit.

          ---

          ## 3. The Playbook""".replace("\n          ", "\n")
          replacement = """The classes of content that are always untrusted: SKILL.md bodies and plugin documentation,
          scanner and linter output, CVE and advisory text, dependency metadata, commit messages,
          issue and pull request bodies, and any file content read from the repository under audit.

          ### 2.5 Bounded autopilot

          Autopilot never enlarges authority. It means deterministic continuation of the approved playbook from persisted state, not permission to choose new capabilities, broaden scope, change policy, or infer approval.

          A next action may run automatically only when it is uniquely determined by the active playbook, verified capability lock, repository identity, recorded approvals, current state, declared policies, budgets, and platform guarantees. Missing, stale, conflicting, or ambiguous inputs stop the run.

          The mandatory stops, allowed continuation actions, forbidden actions, retry boundaries, platform handoff rules, and testable invariants are normative in [`docs/architecture/bounded-autopilot.md`](docs/architecture/bounded-autopilot.md).

          ---

          ## 3. The Playbook""".replace("\n          ", "\n")

          assert specification.count(anchor) == 1
          path.write_text(specification.replace(anchor, replacement))
          Path(".github/workflows/commit-003-pr-builder.yml").unlink()
          PY

      - name: Commit final branch state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: define bounded autopilot semantics"
          git push origin HEAD:feat/003-bounded-autopilot-semantics
