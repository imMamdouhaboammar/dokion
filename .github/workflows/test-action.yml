name: Test Dokion Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Local Dokion Action
        uses: ./
        with:
          dokion-version: 'local'
          playbook: 'playbooks/architecture-mapping.playbook.json'
          fail-on-findings: 'false'
