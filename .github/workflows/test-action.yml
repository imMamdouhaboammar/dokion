name: Test Dokion Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare active Playbook fixture
        shell: bash
        run: |
          mkdir -p .dokion
          cp playbooks/architecture-mapping.playbook.json .dokion/playbook.json

      - name: Test Local Dokion Action
        uses: ./
        with:
          dokion-version: 'local'
          fail-on-findings: 'false'
