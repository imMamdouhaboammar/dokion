name: Test Dokion Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare active Playbook fixture
        shell: bash
        run: |
          mkdir -p .dokion
          cp playbooks/architecture-mapping.playbook.json .dokion/playbook.json

      - name: Run blocked Playbook through the local Action
        id: dokion
        uses: ./
        with:
          dokion-version: 'local'
          fail-on-findings: 'false'

      - name: Assert negative-control outcome
        shell: bash
        env:
          DOKION_STATUS: ${{ steps.dokion.outputs.status }}
          DOKION_EXIT_CODE: ${{ steps.dokion.outputs['exit-code'] }}
        run: |
          set -euo pipefail
          test "$DOKION_STATUS" = "FAILED"
          test "$DOKION_EXIT_CODE" -ne 0
