name: Registry review patch

on:
  push:
    branches:
      - feat/registry-package-builder-verifier

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/registry-package-builder-verifier
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply exact source and fixture edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/registry/package-tar.ts",
              '  writeField(block, 263, 2, "00");\n  writeField(block, 345, 155, prefix);',
              '  writeField(block, 263, 2, "00");\n  writeOctal(block, 329, 8, 0);\n  writeOctal(block, 337, 8, 0);\n  writeField(block, 345, 155, prefix);'
          )
          replace_once(
              "src/registry/package-tar.ts",
              '  assertExactBytes(block, 156, Buffer.from("0", "ascii"), "typeflag", "Archive typeflag must identify a regular file.");',
              '''  const typeFlag = block[156];
          if (typeFlag !== 0x30) {
            throw new DokionError("REGISTRY_PACKAGE_ENTRY_TYPE_UNSUPPORTED", "Package archive entries must be regular files.", {
              field: "typeflag",
              typeFlag: typeFlag === undefined ? null : String.fromCharCode(typeFlag)
            });
          }'''
          )
          replace_once(
              "tests/registry/package-builder-verifier.test.ts",
              '  writeString(block, 263, 2, "00");\n  const checksum = block.reduce((sum, byte) => sum + byte, 0);',
              '  writeString(block, 263, 2, "00");\n  writeOctal(block, 329, 8, 0);\n  writeOctal(block, 337, 8, 0);\n  const checksum = block.reduce((sum, byte) => sum + byte, 0);'
          )
          replace_once(
              "tests/registry/package-builder-verifier.test.ts",
              '  for (const entry of entries) {\n    const header = tarHeader(entry);',
              '  for (const entry of [...entries].sort((left, right) => Buffer.compare(Buffer.from(left.path, "utf8"), Buffer.from(right.path, "utf8")))) {\n    const header = tarHeader(entry);'
          )
          replace_once(
              "tests/registry/package-tar-canonical-metadata.test.ts",
              '    expectCode(() => readRegistryPackageTar(archive), "REGISTRY_PACKAGE_ARCHIVE_INVALID", "typeflag");',
              '    expectCode(() => readRegistryPackageTar(archive), "REGISTRY_PACKAGE_ENTRY_TYPE_UNSUPPORTED", "typeflag");'
          )
          Path(".github/workflows/registry-review-patch.yml").unlink()
          PY
      - name: Focused regression tests
        run: bun test tests/registry/package-tar-canonical-metadata.test.ts tests/registry/package-builder-verifier.test.ts tests/registry/package-adversarial.test.ts tests/registry/package-order-and-count.test.ts tests/registry/package-review-regressions.test.ts tests/registry/package-publication-failures.test.ts
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/registry/package-tar.ts tests/registry/package-builder-verifier.test.ts tests/registry/package-tar-canonical-metadata.test.ts .github/workflows/registry-review-patch.yml
          git commit -m "fix(registry): complete canonical USTAR review fixes"
          git push origin HEAD:feat/registry-package-builder-verifier
