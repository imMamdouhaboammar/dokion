name: Adoption Recovery Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/adoption-truth-recovery-main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python contract dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            jsonschema==4.26.0 \
            referencing==0.37.0

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Verify committed product surface
        shell: bash
        run: |
          set -euo pipefail
          test -s generated/product-surface.json
          bun run generate:product-surface
          git diff --exit-code -- generated/product-surface.json
          first="$(sha256sum generated/product-surface.json | cut -d' ' -f1)"
          bun run generate:product-surface
          second="$(sha256sum generated/product-surface.json | cut -d' ' -f1)"
          test "$first" = "$second"
          git diff --exit-code -- generated/product-surface.json

      - name: Validate contracts
        run: bun run validate:contracts

      - name: Run runtime tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Validate distribution
        run: bun run validate:distribution

      - name: Smoke test package
        run: bun run smoke:package

      - name: Check patch whitespace
        run: git diff --check
