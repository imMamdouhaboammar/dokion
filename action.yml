name: 'Dokion Action'
description: 'Run the active Dokion Playbook and publish its recorded report in GitHub Actions'
author: 'Mamdouh Aboammar'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  playbook:
    description: 'Canonical active Playbook path. Dokion currently accepts only .dokion/playbook.json as execution authority'
    required: false
    default: '.dokion/playbook.json'
  dokion-version:
    description: 'Exact Dokion package version, or local when testing this checkout'
    required: false
    default: '0.3.0'
  working-directory:
    description: 'Repository working directory'
    required: false
    default: '.'
  fail-on-findings:
    description: 'Fail the action when dokion run exits non-zero'
    required: false
    default: 'true'
  create-summary:
    description: 'Append an existing HARDENING.md report to GitHub Step Summary'
    required: false
    default: 'true'

outputs:
  status:
    description: 'Dokion execution status'
    value: ${{ steps.dokion-run.outputs.status }}
  exit-code:
    description: 'Exit code from dokion run'
    value: ${{ steps.dokion-run.outputs.exit-code }}
  report-path:
    description: 'Absolute path to HARDENING.md when present, otherwise empty'
    value: ${{ steps.dokion-run.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Install Dokion
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ "${{ inputs.dokion-version }}" = "local" ]; then
          test -f "$GITHUB_ACTION_PATH/src/cli.ts" || {
            echo "::error::Local Dokion source was not found at the action path"
            exit 1
          }
        else
          bun add --global "dokion@${{ inputs.dokion-version }}"
          command -v dokion >/dev/null || {
            echo "::error::The Dokion executable was not installed"
            exit 1
          }
        fi

    - name: Validate active Playbook
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ "${{ inputs.playbook }}" != ".dokion/playbook.json" ]; then
          echo "::error::Dokion execution authority must be .dokion/playbook.json"
          exit 1
        fi
        if [ ! -f ".dokion/playbook.json" ]; then
          echo "::error::No active Playbook found at .dokion/playbook.json"
          exit 1
        fi
        if [ "${{ inputs.dokion-version }}" = "local" ]; then
          bun run "$GITHUB_ACTION_PATH/src/cli.ts" validate
        else
          dokion validate
        fi

    - name: Run Dokion
      id: dokion-run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        if [ "${{ inputs.dokion-version }}" = "local" ]; then
          bun run "$GITHUB_ACTION_PATH/src/cli.ts" run
        else
          dokion run
        fi
        EXIT_CODE=$?
        set -e

        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        if [ -f "HARDENING.md" ]; then
          echo "report-path=$PWD/HARDENING.md" >> "$GITHUB_OUTPUT"
        else
          echo "report-path=" >> "$GITHUB_OUTPUT"
        fi
        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "status=SUCCEEDED" >> "$GITHUB_OUTPUT"
          echo "failed=false" >> "$GITHUB_OUTPUT"
        else
          echo "status=FAILED" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.fail-on-findings }}" = "true" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
        fi

    - name: Publish recorded status
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "${{ inputs.dokion-version }}" = "local" ]; then
          bun run "$GITHUB_ACTION_PATH/src/cli.ts" status || true
          bun run "$GITHUB_ACTION_PATH/src/cli.ts" findings || true
        else
          dokion status || true
          dokion findings || true
        fi

        if [ "${{ inputs.create-summary }}" = "true" ] && [ -f "HARDENING.md" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          echo "### Dokion Hardening Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat HARDENING.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Enforce exit status
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "${{ steps.dokion-run.outputs.failed }}" = "true" ]; then
          echo "::error::Dokion execution failed. Review the recorded status and evidence"
          exit 1
        fi
